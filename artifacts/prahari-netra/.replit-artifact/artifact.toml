kind = "web"
previewPath = "/"
title = "Prahari Netra"
description = "A professional border intelligence and surveillance network experience with an India operations map, role-specific command and field workspaces, simulated camera intelligence, and cryptographic evidence provenance for trustworthy demo operations."
version = "1.0.0"
id = "artifacts/prahari-netra"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18858

[services.development]
run = "pnpm --filter @workspace/prahari-netra run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/prahari-netra", "run", "build" ]
serve = "static"
publicDir = "artifacts/prahari-netra/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18858"
BASE_PATH = "/"
